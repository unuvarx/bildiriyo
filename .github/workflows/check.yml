name: İlan kontrolü

on:
  schedule:
    # Günde bir tarama, 19:00 TR (16:00 UTC). 21:00 yedektir: GitHub zamanlanmış
    # çalışmaları ara sıra atlayabiliyor; o gün tarama yapıldıysa yedek hemen çıkar.
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:         # Actions sekmesinden elle çalıştırmak için
    inputs:
      ozet:
        description: "Şu an açık tüm uygun ilanların özetini gönder"
        type: boolean
        default: false

permissions:
  contents: write  # state/state.json dosyasını kaydetmek için

concurrency:
  group: bildiriyo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: OCR araçları (taranmış Resmî Gazete PDF'leri için)
        run: sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tur > /dev/null

      - name: İlanları tara ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bildiriyo ${{ inputs.ozet && '--ozet' || '' }}

      - name: Görülen ilanları kaydet
        if: always()
        run: |
          git config user.name "bildiriyo-bot"
          git config user.email "bildiriyo-bot@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs
            git push
          fi
