name: İlan kontrolü

on:
  schedule:
    # Günde bir tarama, ~18:30 TR. GitHub zamanlanmış çalışmaları (özellikle tam
    # saatlerde) saatlerce geciktirip bazen atlıyor; bu yüzden tam saat dışı
    # dakikalar ve üç yedek var. Son 12 saatte tarama yapıldıysa yedek hemen çıkar.
    - cron: "27 15 * * *"
    - cron: "41 16 * * *"
    - cron: "53 17 * * *"
    - cron: "13 19 * * *"
  workflow_dispatch:         # Actions sekmesinden elle çalıştırmak için
    inputs:
      ozet:
        description: "Şu an açık tüm uygun ilanların özetini gönder"
        type: boolean
        default: false

permissions:
  contents: write  # state/state.json dosyasını kaydetmek için

concurrency:
  group: bildiriyo
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Kurulamazsa tarama yine çalışır, sadece taranmış PDF'ler OCR'sız kalır.
      - name: OCR araçları (taranmış Resmî Gazete PDF'leri için)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-tur > /dev/null

      - name: İlanları tara ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bildiriyo ${{ inputs.ozet && '--ozet' || '' }}

      - name: Görülen ilanları kaydet
        if: always()
        run: |
          git config user.name "bildiriyo-bot"
          git config user.email "bildiriyo-bot@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs
            git push
          fi

      # Python'a hiç gelinmese bile ulaşsın diye doğrudan curl ile gönderilir.
      - name: Hata olursa Telegram'a bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --retry 3 --fail-with-body "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Bot çalışmadı, bu tarama yapılamadı. Hata kaydı: ${RUN_URL}"
